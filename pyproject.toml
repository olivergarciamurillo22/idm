# Solo configuración de ruff y pytest. El paquete se ejecuta con PYTHONPATH=src
# (ver README y ejecutar.sh / ejecutar.bat); no hay build ni instalación.

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [".venv", "datos", "migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["B008"]  # Depends() en FastAPI

[tool.ruff.lint.isort]
known-first-party = ["idm"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
